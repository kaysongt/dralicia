  <style>:root {
  --bg: #faf9f6;
  --ink: #1a1810;
  --muted: #6b6553;
  --brand: #f5c518;
  --brand-dark: #d4a80f;
  --brand-text: #1a1810;
  --card: #ffffff;
  --line: #ded9cc;
  --dark: #1a1810;
  --soft: #f1eee5;
  --focus: #886200;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 104px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; line-height: 1.65; }
[hidden] { display: none !important; }
img { max-width: 100%; height: auto; }
button, input, select { font: inherit; }
button, a, input, summary { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-underline-offset: .25em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
::selection { background: var(--brand); color: var(--ink); }
h1, h2, h3, h4, p { margin-top: 0; }
h1, h2, h3 { line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 4.5vw, 3.8rem); letter-spacing: -.035em; }
h2 { font-size: clamp(1.8rem, 3.1vw, 2.55rem); letter-spacing: -.025em; margin-bottom: 1rem; }
h3 { font-size: 1.25rem; letter-spacing: -.015em; }
p { margin-bottom: 1rem; }
.container { width: min(1180px, calc(100% - 64px)); margin-inline: auto; }
.section { padding: clamp(3.5rem, 6.5vw, 6rem) 0; }
.lead { font-size: 1.1rem; line-height: 1.7; max-width: 58ch; color: var(--muted); }
.muted, .about-body { color: var(--muted); }
.alt { background: var(--soft); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.skip-link { position: absolute; top: -100px; left: 1rem; z-index: 100; padding: .75rem 1rem; background: var(--brand); color: var(--ink); }
.skip-link:focus { top: .5rem; }

/* Shared header and native mobile navigation. */
.announcement-bar { background: var(--dark); color: #e8e1d0; }
.announcement-inner { text-align: center; }
.announcement-link { display: flex; justify-content: center; flex-wrap: wrap; gap: .15rem .9rem; padding: .65rem 0; font-size: .82rem; text-decoration: none; }
.announcement-link strong { color: var(--brand); }
.announcement-link:hover { text-decoration: underline; }
.topbar { position: sticky; top: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); }
.nav { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; min-height: 88px; padding-block: .9rem; }
.brand { display: inline-flex; flex-shrink: 0; align-items: center; }
.logo { display: block; width: 54px; height: 54px; object-fit: contain; }
.site-nav { display: flex; gap: 1.65rem; align-items: center; }
.site-nav a { text-decoration: none; font-weight: 500; font-size: .9rem; color: var(--muted); padding: .6rem 0; }
.site-nav a:hover { color: var(--ink); text-decoration: underline; }
.nav-actions { display: flex; align-items: center; gap: .7rem; }
.mobile-menu { display: none; }
.mobile-menu summary { display: flex; gap: .6rem; align-items: center; min-height: 44px; cursor: pointer; list-style: none; padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 8px; font-size: .85rem; font-weight: 600; }
.mobile-menu summary::-webkit-details-marker { display: none; }
.mobile-menu[open] summary { background: var(--soft); }
.mobile-menu nav { position: absolute; left: 0; right: 0; top: calc(100% + 1px); display: grid; padding: .75rem 1rem; background: var(--bg); border: 1px solid var(--line); border-top: 0; box-shadow: 0 14px 24px rgb(26 24 16 / 10%); max-height: calc(100dvh - 100px); overflow-y: auto; }
.mobile-menu:not([open]) > nav { display: none; }
.mobile-menu nav a { min-height: 44px; display: flex; align-items: center; text-decoration: none; padding: .6rem .8rem; border-radius: 6px; }
.mobile-menu nav a:hover { background: var(--soft); }

/* Shared controls. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: .8rem 1.35rem; background: var(--brand); border: 1px solid var(--brand); border-radius: 8px; color: var(--brand-text); font-size: .92rem; line-height: 1.4; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; transition: background-color .18s ease, border-color .18s ease; }
.btn:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
.btn-sm { min-height: 44px; padding: .6rem 1.1rem; font-size: .85rem; }
.btn-ghost { background: transparent; border-color: #bfb8a5; color: var(--ink); }
.btn-ghost:hover { background: var(--soft); border-color: var(--ink); }
.btn-ghost-light { border-color: #847a62; color: #faf9f6; }
.btn-ghost-light:hover { background: #302c22; border-color: #eee6d4; color: #faf9f6; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.7rem; }

/* A clear introduction, with one portrait and room for the message. */
.hero { background: var(--dark); color: #faf9f6; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .85fr); gap: 3rem; align-items: end; }
.hero-content { padding: 4.5rem 0 4rem; }
.hero h1 { max-width: 650px; margin-bottom: 1.3rem; }
.hero-role { color: #ecd27b; font-size: .9rem; margin-bottom: 1.1rem; }
.hero .lead { color: #d2cbb8; font-size: 1.04rem; max-width: 50ch; }
.hero-image-wrap { display: flex; align-items: flex-end; min-width: 0; }
.hero-portrait { display: block; width: 100%; height: auto; }
.hero-retreat-link { display: inline-flex; gap: .6rem; color: #ecd27b; font-size: .85rem; margin-top: 1.7rem; text-decoration: none; }
.hero-retreat-link:hover { text-decoration: underline; }

/* Services appear early and read as a directory rather than competing cards. */
.services-layout { display: grid; grid-template-columns: minmax(0, .78fr) minmax(0, 1.6fr); gap: 4rem; }
.services-intro h2 { max-width: 13ch; }
.services-intro .muted { max-width: 28ch; }
.service-list { border-top: 1px solid var(--line); }
.service-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: .5rem 1.5rem; padding: 1.4rem 0; border-bottom: 1px solid var(--line); }
.service-item h3 { margin: 0; font-size: 1.05rem; line-height: 1.5; }
.service-item p { margin: 0; font-size: .92rem; color: var(--muted); }
.service-link { grid-column: 2; width: fit-content; padding: .3rem 0; color: var(--ink); font-weight: 600; font-size: .85rem; text-decoration-color: #b7a45b; }

/* Retreat overview and an optional package comparison. */
.retreat-section { background: var(--soft); }
.retreat-editions { display: flex; flex-wrap: wrap; gap: .6rem; padding: 1rem 0 1.8rem; }
.retreat-editions a { min-height: 44px; font-size: .85rem; }
.retreat-arizona-promo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: center; padding: 2.3rem; margin-bottom: 2.5rem; background: var(--dark); color: #faf9f6; border-radius: var(--radius); }
.retreat-arizona-promo h3 { font-size: clamp(1.4rem, 2.5vw, 1.9rem); margin-bottom: .8rem; }
.retreat-arizona-promo p { font-size: .95rem; max-width: 65ch; margin-bottom: .6rem; }
.retreat-arizona-promo .muted { color: #c9c1ad; font-size: .87rem; }
.retreat-arizona-promo .hero-actions { display: flex; flex-direction: column; margin: 0; }
.retreat-arizona-promo .btn-ghost { color: #eee7d8; border-color: #847a62; }
.retreat-arizona-promo .btn-ghost:hover { background: #302c22; }
.retreat-hero { margin-bottom: 1.5rem; }
.retreat-text { max-width: 800px; }
.retreat-text h3 { font-size: clamp(1.5rem, 2.7vw, 2rem); margin-bottom: .5rem; }
.retreat-season { color: var(--muted); font-size: .9rem; margin-bottom: .8rem; }
.retreat-badges { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: 1.1rem; }
.rbadge { font-size: .8rem; font-weight: 600; color: #665e48; }
.retreat-packages { margin-top: 2rem; border-top: 1px solid #cfc7b4; border-bottom: 1px solid #cfc7b4; }
.retreat-packages > summary { padding: 1.25rem 0; font-weight: 600; cursor: pointer; }
.retreat-pricing { padding: 1.2rem 0 2rem; }
.retreat-pricing h3 { margin-bottom: 1rem; }
.price-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; margin-block: 1.5rem; }
.price-tier { position: relative; border-top: 1px solid #cfc7b4; padding-top: 1.2rem; }
.tier-badge { display: inline-block; background: var(--brand); border-radius: 4px; padding: .1rem .4rem; font-size: .7rem; margin-bottom: .4rem; }
.tier-name { font-size: .95rem; font-weight: 700; margin-bottom: .5rem; }
.tier-price { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tier-price span { color: var(--muted); font-size: .85rem; font-weight: 400; }
.tier-note, .tier-detail { font-size: .85rem; color: var(--muted); }
.retreat-includes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; border-top: 1px solid #cfc7b4; padding: 2rem 0; }
.ri-col h4 { font-size: 1rem; margin-bottom: 1rem; }
.ri-col ul { padding-left: 1.1rem; margin: 0; }
.ri-col li { font-size: .87rem; color: var(--muted); margin-bottom: .45rem; }
.ri-col a { overflow-wrap: anywhere; }

/* Story, values, and existing photography. */
.about-section { background: #fff; padding-bottom: 0; }
.about-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.15fr); gap: 4.5rem; align-items: center; }
.about-photo img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 25%; border-radius: var(--radius); }
.about-text .lead { color: var(--ink); margin-bottom: 1rem; }
.about-body { font-size: .97rem; line-height: 1.8; }
.about-pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2rem; padding: 3rem 0; margin-top: 1.5rem; }
.pillar strong { display: block; font-size: 1rem; margin-bottom: .5rem; }
.pillar p { margin: 0; font-size: .88rem; line-height: 1.65; color: var(--muted); }
.stat-strip { padding: 1.7rem 0; border-top: 1px solid var(--line); }
.stat-inner { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem; }
.stat { display: flex; flex-direction: column; }
.stat strong { font-size: 1rem; font-weight: 700; }
.stat span { font-size: .8rem; color: var(--muted); }
.stat-divider { display: none; }
.gallery-section { padding-top: 3.5rem; border-bottom: 1px solid var(--line); }
.gallery-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-top: 1.8rem; }
.gphoto { margin: 0; border-radius: var(--radius); overflow: hidden; aspect-ratio: 3 / 4; background: var(--soft); }
.gphoto img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }

/* Booking embeds have a usable fallback and accessible tabs. */
.appt-intro { display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: center; gap: 2.5rem; margin-bottom: 2rem; }
.appt-intro-photo img { display: block; width: 100%; aspect-ratio: 1; border-radius: var(--radius); object-fit: cover; object-position: center 25%; }
.appt-intro-text { max-width: 700px; }
.appt-intro-text .about-body { margin: 0; }
.cal-tab-btns { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.cal-tab-btn { cursor: pointer; min-height: 48px; background: transparent; border: 1px solid #bfb8a5; border-radius: 8px; padding: .75rem 1.2rem; font-size: .9rem; font-weight: 600; color: var(--ink); }
.cal-tab-btn[aria-selected="true"] { background: var(--brand); border-color: var(--brand); }
.cal-tab-btn:hover { border-color: var(--ink); }
.cal-embed { width: 100%; min-width: 0; height: 700px; overflow: auto; }
.cal-embed iframe { width: 100%; max-width: 100%; border: 0; }
.booking-fallback { color: var(--muted); font-size: .82rem; }
.booking-fallback a { color: var(--ink); font-weight: 600; }

/* Product trust and reviews retain their original content. */
.shop-links { display: flex; flex-wrap: wrap; gap: 1.2rem; margin-top: 1.3rem; }
.shop-links a { font-size: .9rem; font-weight: 600; }
.about-commitment { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; border-top: 1px solid #cfc7b4; padding-top: 2.5rem; margin-top: 3rem; }
.commitment-card h3 { font-size: 1.02rem; margin-bottom: .7rem; }
.commitment-card p { color: var(--muted); font-size: .88rem; margin: 0; }
.testimonials-section { background: var(--dark); color: #faf9f6; }
.testimonials-section .muted { color: #c9c1ad; }
.testimonials-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.5rem; margin-top: 2.5rem; }
.tcard { display: flex; flex-direction: column; gap: 1rem; border-top: 1px solid #5c5441; padding-top: 1.5rem; }
.tcard-stars { color: var(--brand); letter-spacing: .1em; font-size: .85rem; }
.tcard-title { font-size: 1.03rem; margin: 0; }
.tcard-body { font-size: .92rem; color: #d8d1be; flex: 1; margin: 0; }
.tcard-author { display: flex; align-items: center; gap: .7rem; font-size: .87rem; }
.tcard-avatar { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #70664e; color: #e5d9b0; font-size: .68rem; }

/* Consistent footer, including the Cozy Digital credit on every page. */
footer { background: var(--dark); color: #eee7d8; padding: 3.5rem 0 1.3rem; border-top: 1px solid #4a4334; }
.footer-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .75fr) minmax(0, 1.2fr); gap: 3rem; }
.foot-brand strong { display: block; font-size: 1.3rem; margin-bottom: .6rem; }
.foot-brand p { font-size: .85rem; color: #bdb5a2; margin-bottom: 1.4rem; }
footer h2 { font-size: .95rem; margin-bottom: 1rem; letter-spacing: 0; }
.footer-nav, .footer-contact { display: flex; flex-direction: column; align-items: flex-start; gap: .35rem; }
.footer-nav a, .footer-contact a { font-size: .87rem; text-decoration: none; color: #cbc3af; padding-block: .2rem; overflow-wrap: anywhere; max-width: 100%; }
.footer-nav a:hover, .footer-contact a:hover { text-decoration: underline; color: #fff; }
.footer-contact p { font-size: .8rem; color: #bdb5a2; margin: 1rem 0 0; }
.footer-bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; border-top: 1px solid #4a4334; padding-top: 1.4rem; margin-top: 3rem; color: #bdb5a2; font-size: .75rem; }
.footer-bottom p { margin: 0; }
.cozy-credit { color: #e6cf7c; text-decoration: none; }
footer :focus-visible, .hero :focus-visible, .arizona-hero :focus-visible { outline-color: var(--brand); }

/* Arizona details and priority-list form. */
.arizona-page > main > .container > .retreat-editions { padding: 1.1rem 0; }
.arizona-hero { background: var(--dark); color: #faf9f6; padding: 4rem 0; }
.arizona-hero-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .75fr); gap: 4.5rem; align-items: center; }
.arizona-hero h1 { margin-bottom: 1.3rem; }
.arizona-intro { font-size: clamp(1.3rem, 2vw, 1.7rem); line-height: 1.45; color: #ecd27b; }
.arizona-hero-description { color: #d2cbb8; max-width: 48ch; font-size: 1rem; }
.arizona-launch { color: #c9c1ad; font-size: .82rem; max-width: 48ch; margin: 1.2rem 0 0; }
.arizona-portrait { margin: 0; }
.arizona-portrait img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 25%; border-radius: var(--radius); }
.arizona-portrait figcaption { font-size: .78rem; margin-top: .6rem; color: #c9c1ad; }
.arizona-venue-grid, .arizona-signup-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4rem; align-items: start; }
.arizona-venue-grid address { font-style: normal; color: var(--muted); margin-top: 1.3rem; }
.text-link, .arizona-questions a, .priority-help a { color: #665000; font-weight: 600; }
.arizona-venue-details h3 { margin-bottom: .65rem; }
.arizona-venue-details h3:not(:first-child) { margin-top: 2rem; }
.arizona-venue-details p { color: var(--muted); }
.arizona-signup-section { background: var(--soft); }
.arizona-facts { margin-block: 2rem 1.5rem; }
.arizona-facts > div { display: flex; justify-content: space-between; gap: 1rem; padding: .9rem 0; border-bottom: 1px solid #cfc7b4; }
.arizona-facts dt { font-size: .85rem; color: var(--muted); }
.arizona-facts dd { font-size: .95rem; font-weight: 700; margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.interest-count { font-weight: 600; }
.priority-form-wrap { background: #fff; border-radius: var(--radius); padding: 2rem; }
.priority-form-wrap h3 { margin-bottom: .8rem; }
.priority-form-wrap p { font-size: .88rem; }
.priority-form-wrap fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.priority-name-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.priority-form-wrap label { display: block; font-weight: 600; font-size: .85rem; margin: 1rem 0 .4rem; }
.priority-form-wrap input:not([type="checkbox"]) { width: 100%; min-height: 48px; border: 1px solid #948b72; color: var(--ink); background: #fff; padding: .7rem .8rem; border-radius: 6px; caret-color: var(--focus); }
.priority-form-wrap .priority-consent { display: flex; align-items: flex-start; gap: .65rem; font-size: .8rem; font-weight: 400; margin: 1.2rem 0; }
.priority-consent input { width: 18px; height: 18px; flex-shrink: 0; margin: .2rem 0 0; accent-color: var(--focus); }
.priority-form-wrap .btn { width: 100%; }
.priority-form-wrap button:disabled, .priority-form-wrap fieldset:disabled button { opacity: .6; cursor: wait; }
.form-trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.priority-help { color: var(--muted); overflow-wrap: anywhere; margin: 1.2rem 0 0; }
#priority-status:empty { margin: 0; }
#priority-status:not(:empty) { padding: 1rem 0 0; font-weight: 600; }
#priority-status.is-error { color: #a51e19; }
.arizona-questions { max-width: 800px; }
.arizona-questions details { padding: 1.25rem 0; border-bottom: 1px solid var(--line); }
.arizona-questions summary { cursor: pointer; font-weight: 600; }
.arizona-questions details p { color: var(--muted); margin: 1rem 0 0; }

.error-page { display: grid; place-items: center; min-height: 100svh; padding: 2rem 0; }
.error-content { width: min(620px, calc(100% - 40px)); }
.error-content h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); }
.error-content > p { color: var(--muted); }
.error-code { color: var(--focus) !important; font-weight: 700; margin: 2.5rem 0 .75rem; }
.error-credit { display: inline-block; color: var(--muted); font-size: .8rem; margin-top: 3rem; }
/* ── Shopify Product Fixes ── */
.shopify-buy__product__actual-price {
  color: var(--ink) !important;
  font-weight: 700 !important;
}
.shopify-buy__product__compare-price {
  text-decoration: line-through !important;
  color: var(--muted) !important;
  font-size: .9em !important;
}
/* Single unified grid across the collection AND the individually-embedded
   products (journal, gift card) so all 7 wrap onto shared rows.
   The embeds use iframe:false (set in index.html) so every card is a real
   .shopify-buy__product in the page DOM. Shopify nests the 5 collection cards
   under .shopify-buy__collection > .shopify-buy__collection-products, so those
   wrappers (and the 3 component <div>s) are flattened with display:contents
   until each card is a direct grid item of .products-grid.
   Verified against the rendered DOM with headless Chromium. */
.products-grid {
  display: grid !important;
  /* minmax(0,1fr) lets tracks shrink below card min-content so the grid
     never blows out past its container */
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  gap: 1.5rem !important;
  margin-top: 2rem;
}
@media (max-width: 760px) {
  .products-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}
@media (max-width: 480px) {
  .products-grid { grid-template-columns: minmax(0, 1fr) !important; }
}
.products-grid > div,
.products-grid .shopify-buy-frame,
.products-grid .shopify-buy__collection,
.products-grid .shopify-buy__collection-products {
  display: contents !important;
}
.products-grid .shopify-buy__product {
  width: 100% !important;
  max-width: 100% !important;
  min-width: 0 !important;
  margin: 0 !important;
}
/* The collection holds exactly 5 products (all fit on page 1), but the
   un-iframed collection component still renders a "Next page" button that
   leads nowhere — hide it. (If the catalog ever outgrows one page, remove
   this rule to restore pagination.) */
.products-grid .shopify-buy__collection-pagination-button { display: none !important; }

/* Product cards styled to match the rest of the site (white card, shadow, hover lift) */
.shopify-buy__product {
  background: var(--card) !important;
  border: 1px solid var(--line) !important;
  border-radius: 20px !important;
  padding: 1.1rem 1.1rem 1.4rem !important;
  box-shadow: 0 4px 20px rgba(26,24,16,.06) !important;
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease !important;
  text-align: center !important;
  display: flex !important;
  flex-direction: column !important;
}
.shopify-buy__product:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 36px rgba(26,24,16,.12) !important;
  border-color: var(--brand) !important;
}
.shopify-buy__product__variant-img,
.shopify-buy__product-img,
.shopify-buy__product__image-wrapper img,
.shopify-buy__product__image img,
.shopify-buy__product img {
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  border-radius: 14px !important;
  aspect-ratio: 1 / 1;
  object-fit: cover !important;
  display: block !important;
}
.shopify-buy__product__title {
  font-weight: 800 !important;
  color: var(--ink) !important;
  font-size: .98rem !important;
  line-height: 1.3 !important;
  margin: .9rem 0 .3rem !important;
  letter-spacing: -.01em !important;
}
.shopify-buy__product__price {
  margin-bottom: .8rem !important;
  font-size: 1rem !important;
}
/* iframe:false drops Shopify's default stylesheet, so re-hide the a11y
   "Regular price"/"Sale price" labels that are meant to be visually hidden */
.products-grid .visuallyhidden {
  position: absolute !important;
  width: 1px !important; height: 1px !important;
  overflow: hidden !important;
  clip: rect(0 0 0 0) !important;
  white-space: nowrap !important;
  border: 0 !important; padding: 0 !important; margin: -1px !important;
}
/* Variant dropdown (e.g. gift-card denominations): style the <select> and
   shrink Shopify's caret SVG, which otherwise renders full-card-width */
.products-grid .shopify-buy__product__variant-selectors { margin-top: auto !important; }
.products-grid .shopify-buy__option-select__label:not(.visuallyhidden) {
  display: block !important;
  font-size: .8rem !important;
  color: var(--muted) !important;
  margin-bottom: .35rem !important;
}
.products-grid .shopify-buy__option-select-wrapper { position: relative !important; }
.products-grid .shopify-buy__option-select__select {
  width: 100% !important;
  padding: .6rem 2rem .6rem .75rem !important;
  border: 1.5px solid var(--line) !important;
  border-radius: 8px !important;
  background: var(--bg) !important;
  font-size: .88rem !important;
  color: var(--ink) !important;
  -webkit-appearance: none !important;
  -moz-appearance: none !important;
  appearance: none !important;
  cursor: pointer !important;
}
.products-grid .shopify-buy__option-select-wrapper svg,
.products-grid .shopify-buy__select-icon {
  position: absolute !important;
  right: .75rem !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  width: 12px !important;
  height: 12px !important;
  pointer-events: none !important;
}
/* Add-to-cart button: match the site's primary (gold) button, full width */
.shopify-buy__btn {
  border-radius: 10px !important;
  font-weight: 700 !important;
  font-size: .9rem !important;
}
.products-grid .shopify-buy__btn-wrapper { margin-top: .3rem !important; }
.products-grid .shopify-buy__btn {
  background: var(--brand) !important;
  color: var(--brand-text) !important;
  padding: .75rem 1.2rem !important;
  width: 100% !important;
}
.products-grid .shopify-buy__btn:hover { background: var(--brand-dark) !important; }


/* Responsive rules stay together so mobile never depends on a later override. */
@media (max-width: 1000px) {
  .site-nav { display: none; }
  .mobile-menu { display: block; }
  .hero-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 1.5rem; }
  .hero-content { padding: 3.5rem 0; }
  .hero h1 { font-size: clamp(2.4rem, 4.8vw, 3.3rem); }
  .services-layout { grid-template-columns: 1fr; gap: 1.5rem; }
  .services-intro h2, .services-intro .muted { max-width: 650px; }
  .retreat-arizona-promo { grid-template-columns: 1fr; gap: 1rem; }
  .retreat-arizona-promo .hero-actions { flex-direction: row; }
  .retreat-includes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .about-grid { gap: 2.5rem; }
  .arizona-hero-grid { gap: 2.5rem; }
  .arizona-signup-grid, .arizona-venue-grid { gap: 2rem; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 2rem; }
  .foot-brand { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  html { scroll-padding-top: 90px; }
  .container { width: calc(100% - 40px); }
  .nav { min-height: 78px; padding-block: .7rem; gap: .75rem; }
  .logo { width: 48px; height: 48px; }
  .announcement-link { font-size: .75rem; line-height: 1.5; padding-block: .6rem; }
  .announcement-link span { max-width: 43ch; }
  .hero-grid { grid-template-columns: 1fr; gap: 0; }
  .hero-content { padding: 3rem 0 1rem; }
  .hero h1 { font-size: clamp(2.5rem, 7.5vw, 3.3rem); }
  .hero .lead { font-size: 1rem; }
  .hero-image-wrap { justify-content: center; }
  .hero-portrait { width: min(350px, 85%); }
  .hero-retreat-link { margin-top: 1.4rem; }
  .service-item { grid-template-columns: minmax(0, .8fr) minmax(0, 1.6fr); gap: .5rem 1rem; }
  .retreat-arizona-promo { padding: 1.5rem; }
